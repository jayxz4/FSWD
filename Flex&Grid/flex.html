<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    /*Grid*/
    .container {
        min-width: 200px;
        padding: 20px;
        background-color: #000000;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        justify-items: center;
        border-radius: 20px;
        gap: 5px;
    }
    .items{
        width: 70px;
        height: 70px;
        padding: 10px;
        background-color: #ffffff;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* Flexbox properties - grow, shrink, basis
    .items {
        background-color: #3498db;
        flex-grow: 1;
        flex-basis: 200px;
    }
    .item1{
        flex-shrink: 10;
    }
    .item3{
        flex-shrink: 5;
    }
    .item2{
        flex-grow: 3;
    }
    .item4{
        flex-grow: 2;
    }*/
    /*Grid tasks*/
   @media(max-width: 500px){
    .container{
        background-color: #000000;
    }
    .items{
        padding: 0;
        background-color: #00ffbb;
    }
    }
</style>
<body>
    <div class="container">
        <button class="items item1">1</button>
        <button class="items item2">2</button>
        <button class="items item3">3</button>
        <button class="items item4">4</button>
        <button class="items item5">5</button>
        <button class="items item6">6</button>
        <button class="items item7">7</button>
        <button class="items item8">8</button>
        <button class="items item9">9</button>
        <button class="items item0">0</button>
        <button class="items itemDot">.</button>
        <button class="items itemEquals">=</button>

    </div>
</body>
</html>
